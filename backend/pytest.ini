# medical-data-analysis/backend/pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:overflow encountered in exp:RuntimeWarning
    ignore:Maximum Likelihood optimization failed to converge:UserWarning
    ignore::PendingDeprecationWarning
    ignore:.*missing from font.*:UserWarning
